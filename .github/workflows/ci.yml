name: CI

# This repository is standalone: the solution lives at the root and the default branch is `main`.
# (Before the migration it was a subtree at `extensions/OpenTail.Stingray` on `master`; the old
# path filter and branch name meant neither trigger below could ever fire.)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: Build and CPU-safe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Runner hardware
        run: |
          {
            echo "### Runner hardware"
            echo "- CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p'), $(nproc) logical processors"
            echo "- RAM: $(free -g | awk '/^Mem:/ {print $2" GiB total, "$7" GiB available"}')"
            echo "- Disk /: $(df -h / | awk 'NR==2 {print $2" total, "$4" free"}')"
            echo "- OS: $(. /etc/os-release && echo "$PRETTY_NAME"), image $ImageOS $ImageVersion"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore
        run: dotnet restore OpenTail.Stingray.slnx
      - name: Build
        run: dotnet build OpenTail.Stingray.slnx -c Release --no-restore
      # xunit.v3 runs on Microsoft.Testing.Platform, which the repo-root global.json selects.
      # Without it `dotnet test` silently falls back to VSTest, finds no adapter, and exits 0
      # having run nothing — a green gate that tested zero code. Do not pass `--nologo`: MTP
      # rejects it and fails the run with "Zero tests ran", which reads like a discovery error.
      #
      # `--minimum-expected-tests` makes thin discovery a failure. The floors are per-suite and
      # sit ~15-25% below the counts measured on 2026-08-14, so ordinary churn does not trip them
      # while a collapse does. A flat `1` would only have caught total collapse, not the case
      # where a suite silently discovers a handful of its tests. Raise a floor when a suite grows
      # substantially; never lower one to make a red build green without establishing why the
      # count dropped.
      #
      # NOTE: this option is accepted by `dotnet test` (which forwards it to the platform host),
      # NOT by the test executable directly — running the built .exe with it fails with
      # "unknown option". Keep these invocations going through `dotnet test`.
      #
      # Sessions/ForwardPass/Server each split into a `.Fast` project (no real model/GPU device,
      # default parallelism -- the bulk of each suite's coverage now lives here) and the
      # plain-named heavy project (real model, forced serial, skipped by default via
      # STINGRAY_RUN_HEAVY_TESTS -- see CLAUDE.md's "Test Projects" section). The heavy projects
      # are deliberately NOT invoked below, same as Vulkan/Cuda already weren't: this runner has
      # no models/ directory, so every test in them would skip regardless of that env var (their
      # own real-model fixture checks self-skip independently of the heavy-suite gate). That
      # isn't just wasted CI time -- it actively fails the build. Microsoft.Testing.Platform
      # treats an all-skipped run (0 passed, 0 failed, N skipped) as exit code 8 ("Zero tests
      # ran"), a DIFFERENT check than --minimum-expected-tests (which only looks at discovery
      # count and is satisfied here). Confirmed by running each heavy project standalone after
      # the split: all three exit 8 on this runner. Verify the heavy suites for real on a machine
      # with models/ (`STINGRAY_RUN_HEAVY_TESTS=1 dotnet test tests/OpenTail.Stingray.Tests.Sessions/...`).
      #
      # Discovery does not depend on fixtures or hardware being present -- those only change
      # pass/skip. All floors below are measured discovery counts (not [Fact]/[Theory] method
      # counts, which undercounts Theory expansion), each `dotnet test` run standalone.
      #
      # Sessions.Fast: floor lowered 300 -> 100 on 2026-09-27. Commit 284a1926 (2026-08-27, "Delete
      # InferenceSession/InferenceRuntime, superseded by HotSession") deleted 22 test files (283 test
      # attributes) together with the API they covered, leaving 127 discovered tests. The floor was not
      # adjusted then; main CI has not been green since 2026-08-26.
      - name: CPU-safe test suites
        run: |
          dotnet test tests/OpenTail.Stingray.Tests.Core/OpenTail.Stingray.Tests.Core.csproj -c Release --no-restore -- --minimum-expected-tests 450
          dotnet test tests/OpenTail.Stingray.Tests.Pipeline/OpenTail.Stingray.Tests.Pipeline.csproj -c Release --no-restore -- --minimum-expected-tests 40
          dotnet test tests/OpenTail.Stingray.Tests.TurboQuant/OpenTail.Stingray.Tests.TurboQuant.csproj -c Release --no-restore -- --minimum-expected-tests 60
          dotnet test tests/OpenTail.Stingray.Tests.Cli/OpenTail.Stingray.Tests.Cli.csproj -c Release --no-restore -- --minimum-expected-tests 300
          dotnet test tests/OpenTail.Stingray.Tests.Vision/OpenTail.Stingray.Tests.Vision.csproj -c Release --no-restore -- --minimum-expected-tests 55
          dotnet test tests/OpenTail.Stingray.Tests.Server.Fast/OpenTail.Stingray.Tests.Server.Fast.csproj -c Release --no-restore -- --minimum-expected-tests 200
          dotnet test tests/OpenTail.Stingray.Tests.Sessions.Fast/OpenTail.Stingray.Tests.Sessions.Fast.csproj -c Release --no-restore -- --minimum-expected-tests 100
          dotnet test tests/OpenTail.Stingray.Tests.ForwardPass.Fast/OpenTail.Stingray.Tests.ForwardPass.Fast.csproj -c Release --no-restore -- --minimum-expected-tests 480
          dotnet test tests/OpenTail.Stingray.Tests.Audio.Fast/OpenTail.Stingray.Tests.Audio.Fast.csproj -c Release --no-restore -- --minimum-expected-tests 70
          dotnet test tests/OpenTail.Stingray.Tests.Vulkan.Fast/OpenTail.Stingray.Tests.Vulkan.Fast.csproj -c Release --no-restore -- --minimum-expected-tests 38

  # NativeAOT telemetry check (observability plan D10). Publishes the real CLI and runs `telemetry-selftest`, which needs
  # no model: it fails if Meter/ActivitySource data does not reach an in-process listener in the PUBLISHED binary
  # (MetricsSupport off, or instruments trimmed). Verified locally on win-x64 (fails with MetricsSupport=false, passes with true).
  # Blocking: the Linux job passed on main at bb7d1f68 and 9085aed1 (2026-10-13 and 2026-10-14).
  aot-telemetry:
    name: NativeAOT telemetry self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the CLI (NativeAOT) and run the telemetry self-test
        run: |
          dotnet publish src/OpenTail.Stingray.Cli -c Release -r linux-x64 -o aot-out
          ./aot-out/stingray telemetry-selftest

  # Windows x64 lane (added 2026-11-01). Windows is the primary target and the machine every measurement comes from, but both
  # workflows above ran on Linux only, so nothing independently proved the Windows build, the win-x64 NativeAOT publish, the
  # published CLI starting, or a clean package consumer. This job does those four things. Same CPU-safe suites and floors as the
  # Linux job (no models, no GPU on the runner), so it adds coverage of the platform, not of more tests.
  windows:
    name: Windows build, tests, NativeAOT and package smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # What hardware did this run get? Printed and written to the job summary so timings and flaky-test reports can be read against it.
      - name: Runner hardware
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          $disk = Get-PSDrive -Name C
          $lines = @(
            "### Runner hardware",
            "- CPU: $($cpu.Name.Trim()), $($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) logical processors, max $($cpu.MaxClockSpeed) MHz",
            "- RAM: $([math]::Round($os.TotalVisibleMemorySize / 1MB, 1)) GiB visible, $([math]::Round($os.FreePhysicalMemory / 1MB, 1)) GiB free",
            "- Disk C: $([math]::Round(($disk.Used + $disk.Free) / 1GB, 0)) GiB, $([math]::Round($disk.Free / 1GB, 0)) GiB free",
            "- OS: $($os.Caption) $($os.Version), image $env:ImageOS $env:ImageVersion")
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Restore
        run: dotnet restore OpenTail.Stingray.slnx
      - name: Build
        run: dotnet build OpenTail.Stingray.slnx -c Release --no-restore
      - name: CPU-safe test suites
        shell: pwsh
        run: |
          $suites = @(
            @('Core', 450), @('Pipeline', 40), @('TurboQuant', 60), @('Cli', 300), @('Vision', 55),
            @('Server.Fast', 200), @('Sessions.Fast', 100), @('ForwardPass.Fast', 480), @('Audio.Fast', 70), @('Vulkan.Fast', 38))
          foreach ($s in $suites) {
            dotnet test "tests/OpenTail.Stingray.Tests.$($s[0])/OpenTail.Stingray.Tests.$($s[0]).csproj" -c Release --no-restore -- --minimum-expected-tests $s[1]
            if ($LASTEXITCODE -ne 0) { throw "suite $($s[0]) failed (exit $LASTEXITCODE)" }
          }
      - name: Publish the CLI (NativeAOT, win-x64) and run the telemetry self-test
        shell: pwsh
        run: |
          dotnet publish src/OpenTail.Stingray.Cli -c Release -r win-x64 -o aot-out
          if ($LASTEXITCODE -ne 0) { throw 'AOT publish failed' }
          ./aot-out/stingray.exe telemetry-selftest
          if ($LASTEXITCODE -ne 0) { throw 'telemetry self-test failed' }
      - name: Pack and smoke-test the packages as a clean consumer
        shell: pwsh
        run: |
          $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./scripts/verify-nuget-package.ps1 -PackageVersion $version -Configuration Release -OutputDirectory ./artifacts/nupkg -SkipTests