name: Publish NuGet

# The version is stated outright in Directory.Build.props (<Version>) — there are no derived or
# pre-release versions. Publication is therefore TAG-TRIGGERED ONLY: pushing to main must not
# publish, because the version would be identical every time and --skip-duplicate would silently
# discard every build after the first.
#
# To release: bump <Version> in Directory.Build.props, commit, then tag `stingray-v<Version>`.
# The tag prefix is `stingray-v`, not a bare `v` — the pre-rename v1.0.0/v1.0.1 tags belong to the
# old OpenTail.LLM series. The guard step below fails the run if tag and <Version> disagree.
# All three packable projects (OpenTail.Stingray, .Server, .Cli) ship from the same job.
on:
  push:
    tags: ['stingray-v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # With a hand-written <Version>, the classic mistake is tagging stingray-v1.0.4 while
      # Directory.Build.props still says 1.0.3: pack would emit 1.0.3, --skip-duplicate would
      # discard it as already published, and the run would go green having shipped nothing.
      # Fail loudly instead.
      #
      # This step is NOT skipped for workflow_dispatch. It used to be, which quietly made the
      # documented "publication is tag-triggered only" policy false: a manual run on any ref could
      # publish whatever <Version> happened to be in Directory.Build.props, or go green having
      # published nothing because --skip-duplicate discarded an already-released version. Manual runs
      # must therefore be dispatched against a stingray-v* tag ref like any other publish.
      - name: Tag must match <Version>
        run: |
          if ! echo "$GITHUB_REF" | grep -q '^refs/tags/stingray-v'; then
            echo "::error::This workflow publishes packages and must run on a stingray-v* tag ref (got $GITHUB_REF). Dispatch it against the tag, or push the tag."
            exit 1
          fi
          tag_version="${GITHUB_REF#refs/tags/stingray-v}"
          file_version="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          echo "tag=$tag_version  Directory.Build.props=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag stingray-v$tag_version does not match <Version>$file_version</Version> in Directory.Build.props."
            exit 1
          fi

      # Release publication is stronger than the fast PR gate: retain a test receipt for the
      # managed suites, including sessions. Hardware/model-dependent rows remain in the release
      # matrix and run on their designated runners.
      #
      # TRX comes from the Microsoft.Testing.Extensions.TrxReport extension referenced by each
      # test project, so the options go after `--` to the test app: `--logger "trx;..."` is a
      # VSTest option and Microsoft.Testing.Platform rejects it. Likewise never pass `--nologo`.
      #
      # Sessions/ForwardPass/Server each split into a `.Fast` project (no real model/GPU device;
      # invoked below) and a plain-named heavy project (real model, skipped by default via
      # STINGRAY_RUN_HEAVY_TESTS). The heavy projects are deliberately NOT invoked here, same as
      # this runner never had models/ for the pre-split ForwardPass's GPU/model rows: every test
      # in them would skip (no models/ on this runner), and Microsoft.Testing.Platform treats an
      # all-skipped run as exit code 8 ("Zero tests ran") regardless of --minimum-expected-tests.
      # Verify the heavy suites for real on a model-provisioned runner with
      # STINGRAY_RUN_HEAVY_TESTS=1 — see ci.yml for the full reasoning.
      - name: Release-quality managed tests
        run: |
          dotnet test tests/OpenTail.Stingray.Tests.Core/OpenTail.Stingray.Tests.Core.csproj -c Release -- --report-trx --report-trx-filename core.trx --results-directory ./artifacts/test-results --minimum-expected-tests 450
          dotnet test tests/OpenTail.Stingray.Tests.Pipeline/OpenTail.Stingray.Tests.Pipeline.csproj -c Release -- --report-trx --report-trx-filename pipeline.trx --results-directory ./artifacts/test-results --minimum-expected-tests 40
          dotnet test tests/OpenTail.Stingray.Tests.TurboQuant/OpenTail.Stingray.Tests.TurboQuant.csproj -c Release -- --report-trx --report-trx-filename turboquant.trx --results-directory ./artifacts/test-results --minimum-expected-tests 60
          dotnet test tests/OpenTail.Stingray.Tests.Cli/OpenTail.Stingray.Tests.Cli.csproj -c Release -- --report-trx --report-trx-filename cli.trx --results-directory ./artifacts/test-results --minimum-expected-tests 300
          dotnet test tests/OpenTail.Stingray.Tests.Vision/OpenTail.Stingray.Tests.Vision.csproj -c Release -- --report-trx --report-trx-filename vision.trx --results-directory ./artifacts/test-results --minimum-expected-tests 55
          dotnet test tests/OpenTail.Stingray.Tests.Server.Fast/OpenTail.Stingray.Tests.Server.Fast.csproj -c Release -- --report-trx --report-trx-filename server-fast.trx --results-directory ./artifacts/test-results --minimum-expected-tests 200
          dotnet test tests/OpenTail.Stingray.Tests.Sessions.Fast/OpenTail.Stingray.Tests.Sessions.Fast.csproj -c Release -- --report-trx --report-trx-filename sessions-fast.trx --results-directory ./artifacts/test-results --minimum-expected-tests 300
          dotnet test tests/OpenTail.Stingray.Tests.ForwardPass.Fast/OpenTail.Stingray.Tests.ForwardPass.Fast.csproj -c Release -- --report-trx --report-trx-filename forwardpass-fast.trx --results-directory ./artifacts/test-results --minimum-expected-tests 480

      # A number of heavyweight tests intentionally return early when their GGUF fixture is not
      # installed. Preserve an explicit fixture-coverage receipt beside the TRX files so a green
      # managed-suite summary is never mistaken for hardware/model coverage.
      - name: Record model-fixture coverage
        shell: pwsh
        # The coverage script intentionally uses Write-Host for a readable local table. Merge
        # PowerShell's host/information stream before teeing it, otherwise the command succeeds
        # but leaves no transcript for the uploaded receipt.
        #
        # Deliberately WITHOUT -FailOnMissing: this runner has no model fixtures by design, so the
        # switch would fail every release. It belongs on a fixture-provisioned runner that is
        # supposed to hold a given row.
        #
        # This receipt used to be the only way to know a model-gated test had not really run,
        # because those tests returned early and were counted as PASSES. They now call
        # Assert.SkipUnless, so the TRX files beside this transcript report them as skipped and the
        # suite totals no longer overstate what executed. The transcript remains useful for naming
        # WHICH fixtures were absent.
        run: ./scripts/check-test-model-coverage.ps1 *>&1 | Tee-Object ./artifacts/test-results/model-fixture-coverage.txt

      - name: Upload release-quality results
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-results
          path: ./artifacts/test-results
          if-no-files-found: error

      # Do not let CI's release package gate drift from the local one. The verifier packs every
      # published package, validates contents, restores/runs a clean library consumer, compiles a
      # clean ASP.NET Core Server consumer, and installs/runs the CLI from that exact local feed.
      # Managed tests already ran above, so this invocation only performs package validation.
      - name: Pack and validate published packages
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Directory.Build.props -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./scripts/verify-nuget-package.ps1 -PackageVersion $version -Configuration Release -OutputDirectory ./artifacts/nupkg -SkipTests

      - name: List packages
        run: ls -la ./artifacts/nupkg

      - name: Push to nuget.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        # --skip-duplicate makes re-runs safe (idempotent on the same version).
        # The same command pushes all .nupkg files; matching .snupkg symbol packages
        # are auto-uploaded alongside.
        run: >
          dotnet nuget push './artifacts/nupkg/*.nupkg'
          --api-key "$NUGET_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
